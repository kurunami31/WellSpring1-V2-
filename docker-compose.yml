version: "3.8"

services:
  # ============ DATABASE ============
  postgres:
    image: postgres:16-alpine
    container_name: wellspring-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wellspring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============ API ============
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: wellspring-api
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/wellspring?schema=public"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-min-32-chars"
      JWT_EXPIRES_IN: "8h"
      PORT: "3001"
      NODE_ENV: "production"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ============ WEB (Frontend) ============
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: wellspring-web
    environment:
      VITE_API_URL: "http://localhost:3001"
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  # ============ REDIS (for future use - caching, sessions) ============
  redis:
    image: redis:7-alpine
    container_name: wellspring-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: wellspring-network